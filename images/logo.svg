<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">忠一口腔品牌标识</title>
  <desc id="desc">忠一口腔，忠于心，精于齿。</desc>
  <rect width="1200" height="1200" fill="#f9fafb"/>
  <rect x="120" y="120" width="960" height="960" rx="8" fill="#ffffff" stroke="#d8e7e2" stroke-width="2"/>
  <rect x="462" y="238" width="276" height="276" rx="8" fill="#0d7c6b"/>
  <text x="600" y="418" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Microsoft YaHei, sans-serif" font-size="138" font-weight="800">忠</text>
  <text x="600" y="654" text-anchor="middle" fill="#073f36" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Microsoft YaHei, sans-serif" font-size="104" font-weight="800">忠一口腔</text>
  <text x="600" y="748" text-anchor="middle" fill="#c49b3c" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" letter-spacing="0">忠于心 · 精于齿</text>
  <text x="600" y="830" text-anchor="middle" fill="#63756f" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Microsoft YaHei, sans-serif" font-size="36" font-weight="500">霸州数字化口腔诊疗中心</text>
</svg>
